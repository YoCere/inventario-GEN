[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; PHP-FPM: procesa las solicitudes PHP (workers)
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Nginx: reverse proxy + sirve assets estáticos
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Laravel Scheduler: reemplaza cron del sistema (suficiente para servidor único)
; En cluster multi-instancia: mover a contenedor dedicado.
[program:scheduler]
command=sh -c "while true; do php /var/www/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Bot de Telegram: escucha los mensajes. Arranca solo en cada despliegue.
;
; El bucle con sleep existe a propósito: el comando SALE solo (sin error) cuando
; el bot está apagado o sin token en Ajustes → Sistema. Así, cuando alguien lo
; configura desde la pantalla, el bot empieza a responder en menos de un minuto
; sin necesidad de redeploy, y mientras tanto no llena los logs reintentando.
;
; Un solo contenedor puede escuchar: Telegram entrega cada mensaje una vez. Si
; algún día hay varias instancias, esto va a UNA sola o se pasa a webhook.
[program:telegram-bot]
command=sh -c "while true; do php /var/www/artisan telegram:poll --no-interaction; sleep 30; done"
autostart=true
autorestart=true
priority=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0